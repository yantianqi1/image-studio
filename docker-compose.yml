services:
  postgres:
    image: postgres:16-alpine
    container_name: commercial-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-yantianqi1}/image-studio-api:${IMAGE_TAG:-latest}
    container_name: commercial-studio-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      ANONYMOUS_SESSION_COOKIE_SECURE: ${ANONYMOUS_SESSION_COOKIE_SECURE:-false}
      ADMIN_SESSION_COOKIE_SECURE: ${ADMIN_SESSION_COOKIE_SECURE:-false}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      ASSET_STORAGE_GCS_BUCKET: ${ASSET_STORAGE_GCS_BUCKET:-}
      ASSET_STORAGE_GCS_PREFIX: ${ASSET_STORAGE_GCS_PREFIX:-generated-assets}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GENERATED_ASSETS_DIR: /app/generated-assets
      SERVICE_NAME: api
    volumes:
      - generated_assets_data:/app/generated-assets
      - ${GCS_CREDENTIALS_FILE:-/dev/null}:/app/gcs-credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7800/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-yantianqi1}/image-studio-worker:${IMAGE_TAG:-latest}
    container_name: commercial-studio-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      ASSET_STORAGE_GCS_BUCKET: ${ASSET_STORAGE_GCS_BUCKET:-}
      ASSET_STORAGE_GCS_PREFIX: ${ASSET_STORAGE_GCS_PREFIX:-generated-assets}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GENERATED_ASSETS_DIR: /app/generated-assets
      WORKER_ENABLE_COMIC_TASK: ${WORKER_ENABLE_COMIC_TASK:-true}
      WORKER_ENABLE_COMIC_ORCHESTRATION: ${WORKER_ENABLE_COMIC_ORCHESTRATION:-true}
    volumes:
      - generated_assets_data:/app/generated-assets
      - ${GCS_CREDENTIALS_FILE:-/dev/null}:/app/gcs-credentials.json:ro
    depends_on:
      api:
        condition: service_healthy

  worker-go:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-yantianqi1}/image-studio-worker-go:${IMAGE_TAG:-latest}
    container_name: commercial-studio-worker-go
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      ASSET_STORAGE_GCS_BUCKET: ${ASSET_STORAGE_GCS_BUCKET:-}
      ASSET_STORAGE_GCS_PREFIX: ${ASSET_STORAGE_GCS_PREFIX:-generated-assets}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GENERATED_ASSETS_DIR: /app/generated-assets
      GO_WORKER_NAME: ${GO_WORKER_NAME:-image-studio-go-worker}
      GO_WORKER_MODE: ${GO_WORKER_MODE:-render}
      GO_WORKER_CONCURRENCY: ${GO_WORKER_CONCURRENCY:-2}
      GO_WORKER_POLL_INTERVAL_SECONDS: ${GO_WORKER_POLL_INTERVAL_SECONDS:-1}
      GO_WORKER_LEASE_SECONDS: ${GO_WORKER_LEASE_SECONDS:-600}
      GO_WORKER_HEARTBEAT_SECONDS: ${GO_WORKER_HEARTBEAT_SECONDS:-15}
      GO_WORKER_SIMULATE_SECONDS: ${GO_WORKER_SIMULATE_SECONDS:-3}
      GO_WORKER_RENDER_TIMEOUT_SECONDS: ${GO_WORKER_RENDER_TIMEOUT_SECONDS:-300}
      GO_WORKER_ENABLE_HTTP: ${GO_WORKER_ENABLE_HTTP:-true}
      GO_WORKER_HTTP_ADDR: ${GO_WORKER_HTTP_ADDR:-:7900}
    expose:
      - "7900"
    volumes:
      - generated_assets_data:/app/generated-assets
      - ${GCS_CREDENTIALS_FILE:-/dev/null}:/app/gcs-credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7900/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  image-api-go:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-yantianqi1}/image-studio-image-api-go:${IMAGE_TAG:-latest}
    container_name: commercial-studio-image-api-go
    profiles:
      - image-api-go
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      ASSET_STORAGE_GCS_BUCKET: ${ASSET_STORAGE_GCS_BUCKET:-}
      ASSET_STORAGE_GCS_PREFIX: ${ASSET_STORAGE_GCS_PREFIX:-generated-assets}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GENERATED_ASSETS_DIR: /app/generated-assets
      GO_IMAGE_API_HTTP_ADDR: ${GO_IMAGE_API_HTTP_ADDR:-:7810}
      GO_IMAGE_API_INTERNAL_DEBUG_TOKEN: ${GO_IMAGE_API_INTERNAL_DEBUG_TOKEN:-}
      GO_IMAGE_API_ENABLE_INTERNAL_CREATE: ${GO_IMAGE_API_ENABLE_INTERNAL_CREATE:-false}
      GO_IMAGE_API_CREATE_ENABLED: ${GO_IMAGE_API_CREATE_ENABLED:-false}
      GO_IMAGE_API_ENABLE_DEBUG_OWNER_HEADERS: ${GO_IMAGE_API_ENABLE_DEBUG_OWNER_HEADERS:-false}
      USER_SESSION_COOKIE_NAME: ${USER_SESSION_COOKIE_NAME:-studio_user_session}
      ANONYMOUS_SESSION_COOKIE_NAME: ${ANONYMOUS_SESSION_COOKIE_NAME:-studio_anonymous_session}
      ANONYMOUS_SESSION_COOKIE_SECURE: ${ANONYMOUS_SESSION_COOKIE_SECURE:-false}
      ANONYMOUS_SESSION_MAX_AGE_SECONDS: ${ANONYMOUS_SESSION_MAX_AGE_SECONDS:-31536000}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me}
    expose:
      - "7810"
    volumes:
      - generated_assets_data:/app/generated-assets
      - ${GCS_CREDENTIALS_FILE:-/dev/null}:/app/gcs-credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7810/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  public-web:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-yantianqi1}/image-studio-public-web:${IMAGE_TAG:-latest}
    container_name: commercial-studio-public-web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:7800
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:7700/',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  admin-web:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-yantianqi1}/image-studio-admin-web:${IMAGE_TAG:-latest}
    container_name: commercial-studio-admin-web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:7800
      ADMIN_SESSION_COOKIE_NAME: ${ADMIN_SESSION_COOKIE_NAME:-studio_admin_session}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:7701/',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: commercial-studio-nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-7700}:80"
      - "${ADMIN_HTTP_PORT:-7701}:81"
    environment:
      GO_IMAGE_API_READS_ENABLED: ${GO_IMAGE_API_READS_ENABLED:-false}
      GO_IMAGE_API_ASSETS_ENABLED: ${GO_IMAGE_API_ASSETS_ENABLED:-false}
      GO_IMAGE_API_SSE_ENABLED: ${GO_IMAGE_API_SSE_ENABLED:-false}
      GO_IMAGE_API_GALLERY_ENABLED: ${GO_IMAGE_API_GALLERY_ENABLED:-false}
      GO_IMAGE_API_DELETE_ENABLED: ${GO_IMAGE_API_DELETE_ENABLED:-false}
      GO_IMAGE_API_CREATE_ENABLED: ${GO_IMAGE_API_CREATE_ENABLED:-false}
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || (nginx -s reload && exit 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      public-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      api:
        condition: service_healthy
      worker-go:
        condition: service_healthy

volumes:
  postgres_data:
  generated_assets_data:
