resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  error_page 413 = @public_payload_too_large_json;

  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  set $upstream_api http://api:7800;
  set $upstream_public_web http://public-web:7700;

  location = /health {
    proxy_pass $upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/public/ {
    proxy_pass $upstream_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /_next/ {
    proxy_pass $upstream_public_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass $upstream_public_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @public_payload_too_large_json {
    internal;
    default_type application/json;
    return 413 '{"data":null,"meta":{},"error":{"code":"payload_too_large","message":"上传文件过大，请压缩到 50MB 以内后重试。"}}';
  }
}

server {
  listen 81;
  server_name _;
  client_max_body_size 50m;
  error_page 413 = @admin_payload_too_large_json;

