server {
  listen 80;
  server_name _;
  client_max_body_size 50m;
  error_page 413 = @public_payload_too_large_json;

  location = /health {
    proxy_pass http://api:7800/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/public/ {
    proxy_pass http://api:7800/api/public/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /_next/ {
    proxy_pass http://public-web:7700/_next/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://public-web:7700/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @public_payload_too_large_json {
    internal;
    default_type application/json;
    return 413 '{"data":null,"meta":{},"error":{"code":"payload_too_large","message":"\u4e0a\u4f20\u6587\u4ef6\u8fc7\u5927\uff0c\u8bf7\u538b\u7f29\u5230 50MB \u4ee5\u5185\u540e\u91cd\u8bd5\u3002"}}';
  }
}

